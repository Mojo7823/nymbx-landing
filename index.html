    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      // Light mode is the default; dark only when the user chose it.
      ;(function () {
        try {
          if (localStorage.getItem('nymbx:theme') === 'dark') {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#1b1b1f')
          }
        } catch {
          /* storage unavailable → stay light */
        }
      })()
    </script>
