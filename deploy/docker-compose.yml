# Local mirror of the two-service Zeabur setup (web + private Gotenberg).
# Run from the repo root:
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then open http://localhost:8080 — the DOCX → PDF tool proxies to Gotenberg
# through Caddy exactly as in production.
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      # In production this defaults to gotenberg.zeabur.internal:3000.
      GOTENBERG_UPSTREAM: gotenberg:3000
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    # No published ports: reachable only on the compose network, mirroring
    # the private-only (no public domain) Zeabur service.
